{% extends "account/base.html" %}

{% load i18n %}
{% load crispy_forms_tags %}


{% block inner %}
  <div class="card mt-4 mb-4">
  <div class="col p-4">
    <img class="img-fluid" src="/static/images/home-image.png">

     <div class="row">
      <h3 class="form text-center fw-bold mt-4">Alterar senha</h3>
    </div>

    <form method="POST" action="{% url 'account_change_password' %}" class="password_change">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-success w-100" type="submit" name="action">ALTERAR</button>
    </form>
  </div>
</div>
{% endblock %}
