{% extends "base.html" %}


{% block content %}
    <div class="row justify-content-md-center mt-4">
      <div class="col-sm-11 col-lg-8">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-dismissible {% if message.tags %}alert-{{ message.tags }}{% endif %}">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
      <div class="card">
        <div class="card-body">
          <div class="d-flex flex-row justify-content-between">
            <div class="d-flex flex-column h4 fw-bold">Valor da cesta:</div>
            <div class="d-flex flex-column h4 fw-bold">
              <div>R${{ basket.total_price|floatformat:2 }}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <div class="d-flex flex-row justify-content-between">
            <div class="d-flex flex-column h4 fw-bold">Seu novo saldo:</div>
            <div class="d-flex flex-column h4 fw-bold">
              <div>R${{ basket.wallet.current_balance|floatformat:2 }}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="row mt-2">
        <div class="mb-1 d-grid">
          <a class="btn btn-secondary" href="{{ basket.get_absolute_url }}">VER PEDIDO</a>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
