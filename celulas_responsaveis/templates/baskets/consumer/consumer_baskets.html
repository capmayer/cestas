{% extends "base.html" %}

{% block content %}
  <div class="row justify-content-md-center">
    <div class="col-sm-11 col-lg-8">
      <h3 class="fw-bold mt-3">Minhas cestas</h3>
      {% if not baskets %}
        <h5>
          Você ainda não possui cestas.
        </h5>
      {% endif %}
      {% for basket in baskets %}
      <div class="card">
        <div class="card-body">
          <a href="{{ basket.get_absolute_url }}" class="stretched-link"></a>
          <h5 class="mb-1">{{ basket.week_cycle.month_cycle }} - {{ basket.week_cycle }}</h5>
        </div>
      </div>
      {% endfor %}
      <a class="btn btn-secondary w-100 mt-2" href="{% url 'baskets:consumer_home' %}">VOLTAR</a>
    </div>
  </div>

{% endblock content %}
