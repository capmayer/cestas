{% extends "base_producer.html" %}
{% load crispy_forms_tags %}

{% block content %}
   <div class="row mt-4">
    <div class="col col-12 col-md-8">
      <h3 class="fw-bold">Iniciar nova semana</h3>
      <p>Ciclo de {{ month_cycle }}</p>
      <form action="{% url 'producer:new_week_cycle' %}" method="post">
        {% csrf_token %}
        <div class="card p-3">
          {{ cycle_form|crispy }}
        </div>
        <input class="btn btn-success w-100 mt-2" type="submit" value="INICIAR SEMANA">
      </form>

    </div>
  </div>
{% endblock content %}
