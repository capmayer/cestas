{% extends "base_producer.html" %}

{% block content %}
  <div class="row mt-4">
    <div class="col col-12 col-md-8">
      <div class="row">
        <div class="col-12">
          <h3 class="fw-bold">Consumidores</h3>
        </div>
      </div>
      {% for wallet in wallets %}
        <div class="card">
          <div class="card-body">
            <a href="{% url 'producer:consumer_wallet' consumer_username=wallet.person %}" class="stretched-link"></a>
            <div class="d-flex flex-column flex-md-row justify-content-between">
              <div class="d-flex align-items-center">
                <h5 class="fw-bold">{{ wallet.person.name }}</h5>
              </div>
              <div class="d-flex flex-column flex-md-row align-items-center">
                <h5 class="fw-bold">CCR {{ wallet.consumer_membership.cell }}</h5>
              </div>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
{% endblock content %}
