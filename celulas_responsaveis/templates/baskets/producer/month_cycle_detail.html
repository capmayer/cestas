{% extends "base_producer.html" %}

{% block content %}
  <div class="row mt-4">
    <div class="col col-12 col-md-8">
      <div class="row mb-4">
        <div class="col-12">
          <h3 class="fw-bold">Ciclo de {{ month_cycle}} - {{ month_cycle.begin.year }}</h3>
        </div>
      </div>
      <h5 class="fw-bold">Semanas</h5>
      {% for week_cycle in month_cycle.week_cycles.all|dictsortreversed:"number" %}
        <div class="card">
          <div class="card-body">
             <a class="stretched-link" href="{% url 'producer:week_cycle_detail' month_identifier=month_cycle.get_identifier week_cycle_number=week_cycle.number %}"></a>

              <div class="">{{ week_cycle }}</div>

          </div>
        </div>
      {% endfor %}
    </div>
  </div>
{% endblock content %}
