{% extends "base_producer.html" %}

{% block content %}
  <div class="row mt-4">
    <div class="col col-12 col-md-8">
      <div class="row mb-4">
        <div class="col-12">
          <h3 class="fw-bold">Ciclos mensais</h3>
        </div>
      </div>
      {% for cycle in month_cycles %}
        <div class="card">
          <a class="stretched-link" href="{% url 'producer:month_cycle_detail' month_identifier=cycle.get_identifier %}">
          </a>
         <div class="card-body">
            <div class="h5 fw-bold">{{ cycle }} - {{ cycle.begin.year }}</div>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
{% endblock content %}
