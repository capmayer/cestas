{% extends "base_producer.html" %}
{% load crispy_forms_tags %}
{% block content %}
  <div class="row mt-4">
    <div class="col col-12 col-md-8">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-dismissible {% if message.tags %}alert-{{ message.tags }}{% endif %}">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
      <h3 class="fw-bold">Adicionar produto</h3>

      <form action="{% url 'producer:new_product' %}"  method="post">
        {% csrf_token %}
        {{ product_form|crispy }}

        <button class="btn btn-success mt-1 w-100" type="submit">ADICIONAR</button>

      </form>
      <a class="btn btn-secondary mt-1 w-100" href="{% url 'producer:products_list_detail' %}">VOLTAR</a>
    </div>
  </div>


{% endblock %}
