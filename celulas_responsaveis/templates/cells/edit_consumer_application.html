{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <div class="row justify-content-md-center mt-4">
    <div class="col-sm-11 col-lg-7">
      <h3 class="fw-bold">Alterar solicitação de participação</h3>
      <form action="{% url 'cells:edit_consumer_application' application_uuid=application.uuid %}" method="post">
        {% csrf_token %}
        <h5 class="fw-bold">Suas respostas</h5>
        <div class="card">
          <div class="card-body">
            {{ application_form|crispy }}
          </div>
        </div>

        <h5 class="mt-2 fw-bold">Tamanho e a periodicidade de entrega da cesta</h5>
        <div class="card">
          <div class="card-body">
            {{ basket_choice_form|crispy }}
          </div>
        </div>
        <input class="btn btn-success w-100 mt-2" type="submit" value="SALVAR ALTERAÇÃO">
      </form>
      <a class="btn btn-secondary w-100 mt-1 mb-2" href="{% url 'cells:consumer_application_detail' application_uuid=application.uuid %}">VOLTAR</a>
    </div>
  </div>

{% endblock content %}
